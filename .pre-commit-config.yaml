# format-hooks pins ruff, Prettier, clang-format and shfmt together; move its rev: to move them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10240]
      - id: check-xml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict

  - repo: https://github.com/fishnos/format-hooks
    rev: v0.2.0
    hooks:
      - id: ruff-check
      - id: ruff-format
      - id: python-spacing
      - id: comment-pronouns
      - id: comment-density
      - id: clang-format
      - id: prettier
      - id: shfmt
      - id: config-drift
      - id: sync-config

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
